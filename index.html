<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Emerging Leaders, Onboarding Hub</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,400;0,500;0,600;0,700;0,800;1,500&display=swap" rel="stylesheet">
<style>
  :root{
    /* Emerging Leaders brand palette, sourced from official brand colours */
    --teal-950:#A3195B;   /* brand magenta, darkest, headers/hero */
    --teal-800:#5A1940;   /* plum-magenta, derived for gradients */
    --teal-700:#7E1C52;   /* mid plum-magenta */
    --teal-600:#A3195B;   /* magenta, brand accent */
    --teal-100:#F3DCE7;   /* magenta tint for badges/backgrounds */
    --orange-600:#F39200; /* brand orange, primary CTA */
    --orange-500:#FFAD3D; /* lighter orange for hover */
    --orange-100:#FDE7C7; /* orange tint for badges/backgrounds */
    --rust-600:#B23A2E;   /* warm red-terracotta, for action-required only */
    --rust-100:#F3DED9;
    --sand-50:#FEFEFE;    /* brand white */
    --sand-100:#F2ECE9;   /* derived warm-neutral tint */
    --sand-200:#E0E0DC;   /* brand light grey */
    --ink-900:#2A2829;    /* brand near-black, body text */
    --ink-700:#55504F;
    --ink-500:#8A8583;
    --white:#FEFEFE;
    --gold-600:#C97F2A;   /* derived warm gold, between orange and blush, for accents */
    --blush-400:#E9B7AE;  /* brand blush */
    --blush-100:#F8E9E5;  /* light blush tint */
    --shadow-sm: 0 1px 3px rgba(46,12,30,0.08);
    --shadow-md: 0 6px 24px rgba(46,12,30,0.14);
    --radius-md: 14px;
    --radius-lg: 22px;
    --serif: 'Poppins', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    --sans: 'Poppins', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  }
  *{box-sizing:border-box;}
  html{scroll-behavior:smooth;}
  body{
    margin:0; font-family:var(--sans); background:var(--sand-50); color:var(--ink-900);
    -webkit-font-smoothing:antialiased;
  }
  h1,h2,h3,h4{font-family:var(--serif); font-weight:700; letter-spacing:-.01em; color:var(--teal-950); margin:0 0 .4em;}
  a{color:var(--teal-700);}
  p{line-height:1.6; color:var(--ink-700);}
  button{font-family:var(--sans); cursor:pointer;}
  .visually-hidden{position:absolute; width:1px;height:1px; overflow:hidden; clip:rect(0,0,0,0);}
  :focus-visible{outline:3px solid var(--orange-600); outline-offset:2px;}

  /* ---------- Top bar ---------- */
  #topbar{
    position:sticky; top:0; z-index:50; background:var(--white);
    border-bottom:1px solid var(--sand-200);
  }
  .scroll-progress{position:absolute; left:0; bottom:-1px; height:3px; width:0%; background:linear-gradient(90deg,var(--orange-600),var(--gold-600)); z-index:51; transition:width .08s linear;}
  .topbar-inner{
    max-width:1360px; margin:0 auto; padding:14px 24px;
    display:flex; align-items:center; justify-content:space-between; gap:24px;
  }
  .brand{display:flex; align-items:center; gap:10px;}
  .brand-mark{
    width:40px;height:40px; display:flex;align-items:center;justify-content:center;
  }
  .brand-mark img{width:100%; height:100%; object-fit:contain;}
  .brand-text{font-family:var(--serif); font-weight:700; font-size:19px; color:var(--teal-950); letter-spacing:.2px;}
  .brand-text span{color:var(--orange-600);}

  #mainnav{display:flex; gap:2px; flex-wrap:wrap;}
  #mainnav button{
    background:none;border:none; padding:9px 13px; border-radius:999px;
    font-size:14px; font-weight:600; color:var(--ink-700); white-space:nowrap;
  }
  #mainnav button:hover{background:var(--sand-100);}
  #mainnav button.active{background:var(--teal-950); color:var(--white);}

  #mobilenav-toggle{display:none;}

  /* ---------- Layout ---------- */
  main{max-width:1360px; margin:0 auto; padding:0 24px 90px;}
  .section-panel{display:none; animation:fadein .35s ease;}
  .section-panel.active{display:block;}
  @keyframes fadein{from{opacity:0; transform:translateY(6px);} to{opacity:1; transform:translateY(0);}}

  .eyebrow{
    font-size:12.5px; font-weight:700; letter-spacing:.09em; text-transform:uppercase;
    color:var(--orange-600); margin-bottom:8px; display:block;
  }
  .section-head{margin:52px 0 26px;}
  .section-head h2{font-size:32px;}
  .section-head p{max-width:640px; font-size:16px;}

  /* ---------- Hero (Start Here) ---------- */
  .hero{
    position:relative; overflow:hidden; border-radius:var(--radius-lg);
    background:var(--teal-950);
    background-image:repeating-linear-gradient(115deg, rgba(255,255,255,.035) 0 2px, transparent 2px 34px);
    border-top:5px solid var(--gold-600);
    margin-top:28px; padding:0; color:var(--sand-50);
  }
  .hero-watermark{
    position:absolute; right:-18px; bottom:-70px; font-family:var(--serif); font-weight:800; font-size:260px;
    color:rgba(255,255,255,.045); line-height:1; letter-spacing:-.04em; z-index:0; pointer-events:none; user-select:none;
  }
  .hero-inner{position:relative; z-index:1; padding:52px 44px 58px; max-width:760px; margin:0 auto; text-align:center;}
  @media(max-width:860px){.hero-inner{grid-template-columns:1fr;} .hero-watermark{display:none;}}
  .hero-photo{
    position:relative; aspect-ratio:4/3; border-radius:16px; border:2px dashed rgba(255,255,255,.32);
    background:rgba(255,255,255,.05); display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:10px; color:var(--sand-100); text-align:center; padding:20px;
  }
  .hero-photo span{font-size:12.5px; font-weight:600; letter-spacing:.02em;}
  .hero-eyebrow{color:var(--orange-500); font-weight:700; letter-spacing:.1em; text-transform:uppercase; font-size:12.5px;}
  .hero h1{color:var(--white); font-size:44px; max-width:620px; margin:10px 0 16px;}
  .hero p.lede{color:var(--sand-100); max-width:560px; font-size:17px; position:relative; z-index:1;}
  .hero-actions{display:flex; gap:14px; margin-top:26px; flex-wrap:wrap; justify-content:center; position:relative; z-index:1;}
  .btn{
    border:none; border-radius:11px; padding:12px 22px; font-weight:700; font-size:14.5px;
    display:inline-flex; align-items:center; gap:8px; transition:transform .15s ease, box-shadow .15s ease;
  }
  .btn:hover{transform:translateY(-1px);}
  .btn-primary{background:var(--orange-600); color:var(--white); box-shadow:0 8px 20px rgba(221,122,59,.35);}
  .btn-primary:hover{background:var(--orange-500);}
  .btn-ghost{background:rgba(255,255,255,.1); color:var(--white); border:1px solid rgba(255,255,255,.35);}
  .btn-ghost:hover{background:rgba(255,255,255,.18);}
  .btn-outline{background:transparent; border:1.5px solid var(--teal-700); color:var(--teal-800);}
  .btn-outline:hover{background:var(--teal-100);}
  .btn-sm{padding:8px 14px; font-size:13px; border-radius:9px;}

  .hero-progress{
    position:relative; z-index:1; margin:34px auto 0; background:rgba(255,255,255,.08);
    border:1px solid rgba(255,255,255,.18); border-radius:14px; padding:18px 20px; max-width:420px; text-align:left;
  }
  .hero-progress-top{display:flex; justify-content:space-between; font-size:13px; font-weight:600; color:var(--sand-100); margin-bottom:8px;}
  .hero-progress-track{height:9px; border-radius:99px; background:rgba(255,255,255,.18); overflow:hidden;}
  .hero-progress-fill{height:100%; border-radius:99px; background:linear-gradient(90deg,var(--orange-500),var(--gold-600));}

  /* ---------- Cards / grids ---------- */
  .grid-3{display:grid; grid-template-columns:repeat(3,1fr); gap:18px;}
  .grid-2{display:grid; grid-template-columns:repeat(2,1fr); gap:18px;}
  @media(max-width:920px){.grid-3{grid-template-columns:repeat(2,1fr);} }
  @media(max-width:640px){.grid-3,.grid-2{grid-template-columns:1fr;}}

  .card{background:var(--white); border:1px solid var(--sand-200); border-radius:var(--radius-md); padding:22px; box-shadow:var(--shadow-sm);}

  /* video thumbnail cards, link out to YouTube instead of embedding */
  .video-thumb-card{position:relative; display:block; width:100%; padding-top:56.25%; border-radius:10px; overflow:hidden; background:var(--ink-900); text-decoration:none; box-shadow:var(--shadow-sm); transition:transform .15s ease, box-shadow .15s ease;}
  .video-thumb-card:hover{transform:translateY(-2px); box-shadow:var(--shadow-md);}
  .video-thumb-card img{position:absolute; top:0; left:0; width:100%; height:100%; object-fit:cover; opacity:.85; transition:opacity .15s ease;}
  .video-thumb-card:hover img{opacity:.65;}
  .video-thumb-card .video-thumb-play{position:absolute; top:50%; left:50%; transform:translate(-50%,-50%); width:56px; height:56px; border-radius:50%; background:var(--orange-600); display:flex; align-items:center; justify-content:center; box-shadow:0 4px 14px rgba(0,0,0,0.35); transition:background .15s ease;}
  .video-thumb-card:hover .video-thumb-play{background:var(--orange-500);}
  .video-thumb-card .video-thumb-play svg{width:20px; height:20px; margin-left:3px;}
  .video-thumb-card .video-thumb-label{position:absolute; left:0; right:0; bottom:0; padding:10px 14px; font-size:13px; font-weight:700; color:var(--white); background:linear-gradient(0deg, rgba(0,0,0,0.65), rgba(0,0,0,0));}

  /* status badges */
  .badge{display:inline-flex; align-items:center; gap:6px; font-size:12px; font-weight:700; padding:5px 11px; border-radius:99px; letter-spacing:.02em;}
  .badge::before{content:''; width:7px;height:7px;border-radius:50%;}
  .badge-not_started{background:var(--sand-100); color:var(--ink-500);}
  .badge-not_started::before{background:var(--ink-500);}
  .badge-in_progress{background:var(--orange-100); color:var(--orange-600);}
  .badge-in_progress::before{background:var(--orange-600);}
  .badge-complete{background:var(--teal-100); color:var(--teal-700);}
  .badge-complete::before{background:var(--teal-700);}
  .badge-action_required{background:var(--rust-100); color:var(--rust-600);}
  .badge-action_required::before{background:var(--rust-600);}

  /* ---------- Roadmap (journey path) ---------- */
  .roadmap{margin-top:20px; position:relative;}
  .roadmap-track{position:relative; padding:6px 0;}
  .roadmap-line{position:absolute; left:19px; top:8px; bottom:8px; width:3px; background:var(--sand-200); border-radius:3px;}
  .roadmap-item{position:relative; padding:0 0 26px 54px;}
  .roadmap-item:last-child{padding-bottom:0;}
  .roadmap-dot{
    position:absolute; left:9px; top:2px; width:22px;height:22px; border-radius:50%;
    background:var(--white); border:3px solid var(--sand-200); display:flex; align-items:center; justify-content:center;
  }
  .roadmap-item.is-complete .roadmap-dot{border-color:var(--teal-700); background:var(--teal-700);}
  .roadmap-item.is-progress .roadmap-dot{border-color:var(--orange-600);}
  .roadmap-dot svg{width:11px;height:11px;}
  .roadmap-title{font-weight:700; color:var(--teal-950); font-size:15px;}
  .roadmap-desc{font-size:13.5px; color:var(--ink-500); margin-top:2px;}

  /* ---------- Checklist ---------- */
  .checklist{list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:2px;}
  .checklist li{display:flex; align-items:flex-start; gap:12px; padding:12px 6px; border-bottom:1px solid var(--sand-100);}
  .checklist li:last-child{border-bottom:none;}
  .checklist input[type=checkbox]{width:19px;height:19px; margin-top:2px; accent-color:var(--teal-700); flex-shrink:0;}
  .checklist label{font-size:14.5px; color:var(--ink-900); cursor:pointer;}
  .checklist label small{display:block; color:var(--ink-500); font-size:12.5px; margin-top:1px;}
  .checklist input:checked + label{color:var(--ink-500); text-decoration:line-through;}

  /* ---------- Week calendar ---------- */
  .week-grid{display:grid; grid-template-columns:repeat(5,1fr); gap:10px; margin-top:16px;}
  @media(max-width:760px){.week-grid{grid-template-columns:1fr;}}
  .week-day{background:var(--sand-100); border-radius:12px; padding:14px;}
  .week-day h4{font-size:13px; text-transform:uppercase; letter-spacing:.06em; color:var(--teal-800); margin-bottom:8px;}
  .week-day ul{margin:0; padding-left:16px; font-size:13px; color:var(--ink-700); line-height:1.6;}

  /* ---------- Module component (repeatable) ---------- */
  .module{background:var(--white); border:1px solid var(--sand-200); border-radius:var(--radius-lg); padding:0; margin-bottom:22px; overflow:hidden; box-shadow:var(--shadow-sm);}
  .module-head{padding:24px 26px 18px; display:flex; justify-content:space-between; align-items:flex-start; gap:16px; flex-wrap:wrap; border-bottom:1px solid var(--sand-100);}
  .module-head h3{font-size:24px; margin-bottom:6px;}
  .module-meta{display:flex; gap:14px; flex-wrap:wrap; font-size:12.5px; color:var(--ink-500); font-weight:600;}
  .module-body{padding:22px 26px 26px;}
  .module-body h5{font-size:12.5px; text-transform:uppercase; letter-spacing:.07em; color:var(--teal-700); margin:0 0 8px;}
  .outcomes{margin:0 0 20px; padding-left:18px; color:var(--ink-700); font-size:14.5px; line-height:1.75;}
  .module-content p{font-size:14.5px;}
  .info-card-grid{display:grid; grid-template-columns:1fr 1fr; gap:16px; margin:18px 0;}
  @media(max-width:700px){.info-card-grid{grid-template-columns:1fr;}}
  .info-card{background:var(--sand-50); border:1px solid var(--sand-100); border-left:4px solid var(--teal-600); border-radius:12px; padding:18px 20px;}
  .info-card.full{grid-column:1/-1; border-left-color:var(--orange-600); background:var(--orange-100);}
  .info-card h5{font-size:14px; text-transform:none; letter-spacing:0; color:var(--teal-950); margin:0 0 6px; font-weight:700;}
  .info-card p{margin:0; font-size:13.5px; color:var(--ink-700); line-height:1.6;}
  .module-side{background:var(--sand-50); border-radius:12px; padding:18px; border:1px solid var(--sand-100); margin-top:22px; display:grid; grid-template-columns:repeat(4,1fr); gap:18px;}
  @media(max-width:760px){.module-side{grid-template-columns:1fr 1fr;}}
  @media(max-width:480px){.module-side{grid-template-columns:1fr;}}
  .module-side .field{margin-bottom:0;}
  .module-side .field-label{font-size:11.5px; text-transform:uppercase; letter-spacing:.06em; color:var(--ink-500); font-weight:700; margin-bottom:3px;}
  .module-side .field-value{font-size:13.5px; color:var(--ink-900);}
  .action-row{display:flex; gap:8px; flex-wrap:wrap; margin-top:14px;}

  /* ---------- Accordion (How We Work) ---------- */
  .accordion-item{background:var(--white); border:1px solid var(--sand-200); border-radius:12px; margin-bottom:10px; overflow:hidden;}
  .accordion-trigger{
    width:100%; text-align:left; background:none; border:none; padding:16px 20px;
    display:flex; justify-content:space-between; align-items:center; font-weight:700; color:var(--teal-950); font-size:15.5px;
  }
  .accordion-trigger .chev{transition:transform .2s ease; color:var(--orange-600);}
  .accordion-item.open .chev{transform:rotate(180deg);}
  .accordion-panel{max-height:0; overflow:hidden; transition:max-height .28s ease;}
  .accordion-panel-inner{padding:0 20px 18px; font-size:14px; color:var(--ink-700); line-height:1.7;}
  .accordion-panel-inner .aw-block{margin-bottom:10px;}
  .accordion-panel-inner strong{color:var(--teal-800);}

  /* ---------- Value cards ---------- */
  .value-card{background:var(--white); border:1px solid var(--sand-200); border-radius:14px; padding:20px;}
  .value-card h4{font-size:19px; margin-bottom:10px; display:flex; align-items:center; gap:8px;}
  .value-card .vtag{width:8px;height:8px;border-radius:50%; background:var(--orange-600); display:inline-block;}
  .value-card dl{margin:0; font-size:13.5px;}
  .value-card dt{font-weight:700; color:var(--teal-700); margin-top:10px; font-size:11.5px; text-transform:uppercase; letter-spacing:.05em;}
  .value-card dd{margin:3px 0 0; color:var(--ink-700);}

  /* ---------- Policy / system cards ---------- */
  .pc{background:var(--white); border:1px solid var(--sand-200); border-radius:14px; padding:20px; display:flex; flex-direction:column; gap:10px;}
  .pc h4{font-size:18px; margin-bottom:0;}
  .pc .pc-row{font-size:13px; color:var(--ink-700);}
  .pc .pc-row b{color:var(--teal-800);}
  .pc .action-row{margin-top:auto;}

  /* ---------- Team ---------- */
  .team-card{background:var(--white); border:1px solid var(--sand-200); border-radius:14px; padding:18px; text-align:center; cursor:pointer; transition:box-shadow .15s ease, transform .15s ease;}
  .team-card:hover{box-shadow:var(--shadow-md); transform:translateY(-2px);}
  .avatar{
    width:72px;height:72px; border-radius:16px; margin:0 auto 10px; display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:3px; background:var(--sand-100); border:1.5px dashed var(--ink-500);
  }
  .avatar svg{opacity:.55;}
  .avatar .avatar-initials{font-family:var(--serif); font-weight:700; font-size:11px; color:var(--ink-500); letter-spacing:.03em;}
  .avatar img{width:100%; height:100%; object-fit:cover; border-radius:14px;}
  .avatar.avatar-photo{background:none; border:1.5px solid var(--sand-200);}
  .team-card h4{font-size:16px; margin-bottom:2px;}
  .team-card .role{font-size:12.5px; color:var(--ink-500); font-weight:600;}
  .team-card .dept{font-size:11.5px; color:var(--orange-600); font-weight:700; text-transform:uppercase; letter-spacing:.04em; margin-top:6px;}

  /* who-to table */
  .org-text{font-size:13.5px; color:var(--ink-700);}
  .org-row{padding:8px 0; border-top:1px dashed var(--sand-200);}
  .org-row:first-child{border-top:none;}
  .org-row b{color:var(--teal-950);}
  .org-dotted{margin-left:10px; font-size:12px; color:var(--ink-500); font-style:italic;}
  .org-row-3{display:grid; grid-template-columns:repeat(4,1fr); gap:14px;}
  @media(max-width:860px){.org-row-3{grid-template-columns:1fr 1fr;}}
  @media(max-width:520px){.org-row-3{grid-template-columns:1fr;}}
  .org-branch{background:var(--sand-50); border:1px solid var(--sand-100); border-radius:10px; padding:10px 12px;}
  .org-branch ul{margin:6px 0 0; padding-left:16px; font-size:12.5px; line-height:1.6;}
  .org-sub{margin-top:8px; font-size:12px; color:var(--ink-500);}

  .wt-table{width:100%; border-collapse:collapse; font-size:14px; margin-top:10px;}
  .wt-table th{text-align:left; font-size:11.5px; text-transform:uppercase; letter-spacing:.05em; color:var(--ink-500); padding:8px 10px; border-bottom:2px solid var(--sand-200);}
  .wt-table td{padding:11px 10px; border-bottom:1px solid var(--sand-100); color:var(--ink-700);}
  .wt-table tr:hover td{background:var(--sand-50);}

  /* ---------- Modal ---------- */
  .modal-overlay{position:fixed; inset:0; background:rgba(14,46,43,.55); display:none; align-items:center; justify-content:center; z-index:200; padding:20px;}
  .modal-overlay.open{display:flex;}
  .modal{background:var(--white); border-radius:18px; max-width:520px; width:100%; max-height:85vh; overflow-y:auto; padding:30px;}
  .modal-close{float:right; background:none; border:none; font-size:22px; color:var(--ink-500); line-height:1;}
  .modal .avatar{width:88px;height:88px; border-radius:18px; margin:0 0 12px;}
  .modal .avatar .avatar-initials{font-size:13px;}
  .modal dl{font-size:13.5px;}
  .modal dt{font-weight:700; color:var(--teal-700); margin-top:12px; font-size:11.5px; text-transform:uppercase; letter-spacing:.05em;}
  .modal dd{margin:3px 0 0; color:var(--ink-700);}

  /* ---------- Callouts ---------- */
  /* ---------- Resource tracker list ---------- */
  .resource-list{margin:18px 0 32px;}
  .resource-list h5{font-size:12.5px; text-transform:uppercase; letter-spacing:.07em; color:var(--teal-700);}
  .resource-item{
    display:flex; justify-content:space-between; align-items:center; gap:14px; flex-wrap:wrap;
    background:var(--white); border:1px solid var(--sand-200); border-radius:11px; padding:12px 16px; margin-bottom:8px;
  }
  .resource-title{font-size:14px; font-weight:600; color:var(--ink-900);}
  .resource-meta{display:flex; gap:10px; flex-wrap:wrap; font-size:12px; color:var(--ink-500); margin-top:2px;}
  .resource-meta span{background:var(--sand-100); padding:2px 8px; border-radius:99px;}
  .resource-meta .resource-note{background:none; padding:0; font-style:italic;}
  .resource-side{display:flex; align-items:center; gap:10px; flex-shrink:0;}

  .callout{border-radius:14px; padding:18px 20px; font-size:14px; display:flex; gap:12px; align-items:flex-start;}

  /* ---------- Mission / Vision statements ---------- */
  .mv-grid{display:grid; grid-template-columns:1fr 1fr; gap:14px; margin:6px 0 20px; max-width:900px;}
  @media(max-width:640px){.mv-grid{grid-template-columns:1fr;}}
  .mv-card{border-radius:14px; padding:20px 22px;}
  .mv-card.mission{background:var(--teal-950);}
  .mv-card.vision{background:var(--orange-100);}
  .mv-label{display:block; font-size:11px; font-weight:800; letter-spacing:.12em; text-transform:uppercase; margin-bottom:9px;}
  .mv-card.mission .mv-label{color:var(--orange-500);}
  .mv-card.vision .mv-label{color:var(--gold-600);}
  .mv-card p{margin:0; font-size:16px; line-height:1.55; font-weight:600;}
  .mv-card.mission p{color:var(--sand-50);}
  .mv-card.vision p{color:var(--teal-950);}
  .callout-note{background:var(--teal-100); color:var(--teal-800);}
  .callout-sample{background:var(--orange-100); color:#8A4B1F; border:1px dashed var(--orange-600);}
  .callout b{display:block; margin-bottom:2px;}

  /* ---------- Ownership / RACI ---------- */
  .raci-table{width:100%; border-collapse:collapse; font-size:14px;}
  .raci-table th{background:var(--teal-950); color:var(--white); text-align:left; padding:11px 14px; font-size:12px; text-transform:uppercase; letter-spacing:.04em;}
  .raci-table td{padding:12px 14px; border-bottom:1px solid var(--sand-100); color:var(--ink-700);}
  .raci-table tr:nth-child(even) td{background:var(--sand-50);}

  footer{margin-top:70px; padding:34px 0; border-top:1px solid var(--sand-200); text-align:center; color:var(--ink-500); font-size:13px;}

  @media(max-width:900px){
    #mainnav{display:none; flex-direction:column; width:100%; position:absolute; top:64px; left:0; background:var(--white); padding:8px 16px 16px; border-bottom:1px solid var(--sand-200);}
    #mainnav.open{display:flex;}
    #mobilenav-toggle{display:block; background:none; border:1px solid var(--sand-200); border-radius:9px; padding:8px 12px; font-weight:700;}
    .hero h1{font-size:32px;}
    .module-meta{flex-direction:column; gap:4px;}
  }
</style>

<script>

const NAV = [
  {id:'start',    label:'Start Here'},
  {id:'story',    label:'Our Story'},
  {id:'people',   label:'People'},
  {id:'work',     label:'How We Work'},
  {id:'policies', label:'Policies & Systems'},
  {id:'role',     label:'Your Role'},
];

const CHECKLIST_DAY1 = [
  {id:'d1-email', text:'Company email set up and accessible', hint:'Confirm with IT that you can log in from your own device.'},
  {id:'d1-systems', text:'Core system access granted', hint:'Google Workspace, KoboToolbox and any programme systems relevant to your role.'},
  {id:'d1-payroll', text:'Payroll and banking documentation submitted', hint:'Forms shared by People/HR before your start date.'},
  {id:'d1-workspace', text:'Workspace / equipment ready', hint:'Laptop, desk, or remote-work setup confirmed.'},
  {id:'d1-policies', text:'Key policies received', hint:'Code of Conduct, Safeguarding Policy and Employee Handbook.'},
];

const ROADMAP = [
  {id:'pre-arrival', title:'Pre-arrival', desc:'Documentation, schedule and system access, meet your manager and buddy.', status:'complete'},
  {id:'m1', title:'Module 1, Welcome & Belonging', desc:'Understand the journey, meet key people, know where to get help.', status:'in_progress'},
  {id:'m2', title:'Module 2, Our Story & Impact', desc:'Why Emerging Leaders exists, how the model works, where we are heading.', status:'not_started'},
  {id:'m3', title:'Module 3, People & Organisation', desc:'Structure, relationships, functions and decision pathways.', status:'not_started'},
  {id:'m4', title:'Module 4, How We Work', desc:'Expected behaviours, communication norms, accountability, safeguarding.', status:'not_started'},
  {id:'m5', title:'Module 5, Policies & Systems', desc:'Key policies, rights, responsibilities, tools and essential processes.', status:'not_started'},
  {id:'m6', title:'Module 6, Role Integration', desc:'Priorities, stakeholders, decision rights, deliverables, first 90 days.', status:'not_started'},
  {id:'i-90', title:'30 / 60 / 90-Day Integration', desc:'Apply the learning, receive feedback, address gaps, transition into the normal performance cycle.', status:'not_started'},
];

/* Maps each roadmap stage to the onboarding section that fulfils it, so the
   roadmap on the homepage can update itself as someone actually goes through
   the hub, instead of showing fixed statuses. 'pre-arrival' is judged by the
   Day 1 checklist; 'i-90' happens after the hub, so it flips to in-progress
   once every section has been visited, signalling the person is ready to
   move into that phase, and becomes complete when they mark it done at the
   end of their 90 days. */
const ROADMAP_NAV_MAP = {m1:'start', m2:'story', m3:'people', m4:'work', m5:'policies', m6:'role'};
function roadmapStatus(r){
  if(r.id === 'pre-arrival'){
    const done = CHECKLIST_DAY1.filter(c=>state.checklist[c.id]).length;
    if(done === 0) return 'not_started';
    return done === CHECKLIST_DAY1.length ? 'complete' : 'in_progress';
  }
  if(r.id === 'i-90'){
    const allVisited = NAV.every(n=>state.visited[n.id]);
    if(!allVisited) return 'not_started';
    return state.roadmap['i-90'] ? 'complete' : 'in_progress';
  }
  const navId = ROADMAP_NAV_MAP[r.id];
  if(!navId) return r.status;
  if(state.visited[navId]) return 'complete';
  if(currentSection === navId) return 'in_progress';
  return 'not_started';
}
function renderRoadmapItems(){
  return ROADMAP.map(r=>{
    const st = roadmapStatus(r);
    const cls = st==='complete' ? 'is-complete' : (st==='in_progress' ? 'is-progress' : '');
    return `<div class="roadmap-item ${cls}">
      <div class="roadmap-dot">${st==='complete' ? '<svg viewBox="0 0 12 12" fill="none"><path d="M2 6l3 3 5-6" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>' : ''}</div>
      <div class="roadmap-title">${r.title}</div>
      <div class="roadmap-desc">${r.desc}</div>
      ${r.id==='i-90' ? roadmapI90Action(st) : ''}
    </div>`;
  }).join('');
}
function roadmapI90Action(st){
  if(st==='not_started') return '<div class="roadmap-desc" style="margin-top:8px; font-style:italic;">You can mark this complete once you have visited every section of the hub.</div>';
  if(st==='complete') return '<button class="btn btn-outline btn-sm" style="margin-top:10px;" data-roadmap-toggle="i-90">Undo complete</button>';
  return '<button class="btn btn-primary btn-sm" style="margin-top:10px;" data-roadmap-toggle="i-90">Mark 90 days complete</button>';
}
/* roadmap items are re-rendered on every progress refresh, so listen at the document level */
document.addEventListener('click', e=>{
  const btn = e.target.closest('[data-roadmap-toggle]');
  if(!btn) return;
  const id = btn.dataset.roadmapToggle;
  state.roadmap[id] = !state.roadmap[id];
  saveState();
  renderAll();
  refreshOverallProgress();
});

const WEEK1 = [
  {day:'Monday', items:['Welcome meeting with manager','IT & systems setup','Tour / virtual orientation call']},
  {day:'Tuesday', items:['Meet your onboarding buddy','Module 1: Welcome & Belonging','HR paperwork review']},
  {day:'Wednesday', items:['Team introductions','Begin Module 2: Our Story & Impact','Leadership for Life, coaching intro (Week 1 of 4)']},
  {day:'Thursday', items:['Shadow a team meeting','Systems quick-start: Google Workspace','1:1 check-in with manager']},
  {day:'Friday', items:['Week 1 reflection & knowledge check','Preview Module 3: People & Organisation','Feedback to People/HR']},
];

              <div style="flex:1; display:grid; grid-template-columns:auto 1fr; align-content:center; gap:6px 14px; padding:14px 16px; background:var(--sand-100); border-radius:10px; font-size:13px;">
                <b style="color:var(--teal-600);">2006–10</b><span>Trevor builds a curriculum with mindset change as its foundation. Without mindset change, the story stays the same.</span>
                <b style="color:var(--teal-600);">2010</b><span>Registered as a charity in the UK.</span>
                <b style="color:var(--teal-600);">2014</b><span>Registered as an NGO in Kenya.</span>
                <b style="color:var(--teal-600);">2020</b><span>Trevor steps out of Emerging Leaders, but the story goes on.</span>
              </div>
            </div>
            <div style="display:flex; flex-direction:column; gap:12px; font-size:14px; line-height:1.6; color:var(--ink-700);">
              <span style="align-self:flex-start; font-size:11px; font-weight:700; letter-spacing:.08em; text-transform:uppercase; color:var(--teal-600); background:var(--teal-100); padding:4px 10px; border-radius:999px;">Our founder story</span>
              <p style="margin:0;">In 2005, Trevor Waldock was teaching leadership in the corporate world, helping organisations develop their people. Then he visited Chawama, a community on the edge of Lusaka, Zambia, at the height of the HIV/AIDS crisis. It broke his heart to see grandmums raising their grandchildren.</p>
              <p style="margin:0;">He asked a question he couldn't put down: what would it take for people to move beyond poverty? He came away with a conviction that still drives us:</p>
              <blockquote style="margin:0; padding:10px 14px; border-left:4px solid var(--orange-600); background:var(--orange-100); border-radius:0 10px 10px 0; font-weight:600; color:var(--teal-950);">People will not get out of poverty unless they learn to lead themselves out of poverty.</blockquote>
              <p style="margin:0;">If leadership could transform people in boardrooms, why not in the poorest communities? Leadership isn't a title. It's knowing you have a story to write, and asking who holds the pen.</p>
              <p style="margin:0;">We want to be known for igniting movements of local leaders who once felt invisible and are now driving hope and change in their communities, proving that the most overlooked people can become the world's most powerful agents of change.</p>
              <div style="display:flex; gap:12px; margin-top:auto;">
                <div style="flex:1; text-align:center; padding:12px; border:1px solid var(--sand-200); border-radius:10px;"><div style="font-size:22px; font-weight:700; line-height:1.2; color:var(--teal-950);">115,000+</div><div style="font-size:12px;">people reached</div></div>
                <div style="flex:1; text-align:center; padding:12px; border:1px solid var(--sand-200); border-radius:10px;"><div style="font-size:22px; font-weight:700; line-height:1.2; color:var(--teal-950);">29</div><div style="font-size:12px;">countries</div></div>
              </div>
            </div>
          </div>
        </div>
        <p><b>Our why.</b> Sustainable change begins with human agency and internal transformation, not knowledge or opportunity alone.</p>
        <div class="mv-grid">
          <div class="mv-card mission"><span class="mv-label">Mission</span><p>Unlocking the potential of people in vulnerable communities by empowering them with the mindsets, motivation and skills to flourish.</p></div>
          <div class="mv-card vision"><span class="mv-label">Vision</span><p>For EVERY person in poverty empowered to be the heroes of their own story.</p></div>
        </div>
        <div class="info-card-grid">
          <div class="info-card">
            <h5>Theory of change</h5>
            <p>Two groups, urban youth in informal settlements and smallholder farmers, share one root problem: poverty narrows belief that change is possible. Everyone gets the same core curriculum (leadership, financial literacy, project planning, mentorship), tracked against each person's own goals. Short term: confidence and financial habits. Over time: steadier income and mentoring the next cohort. Full document with the visual diagram is kept alongside this hub.</p>
          </div>
          <div class="info-card">
            <h5>Leadership for Life</h5>
            <p>Built on two ideas: changing your thinking changes your life, and Ubuntu, people achieve more together. Delivered locally through peer facilitators, small "leadership hubs" of 5–7 people, and ongoing coaching. Four core modules over 12–20 hours, Lead Yourself, Lead Your Finances, Lead Your Project, Lead Your Emotions, plus Lead Your Team for people with direct reports.</p>
          </div>
          <div class="info-card full">
            <h5>Required route</h5>

const VALUES = [
  {name:'Kindness at the Core', meaning:'Kindness is at the heart of who we are, how we work, and how we show up every day. We see and value people, nurture their potential, communicate with honesty and respect, and hold one another accountable in ways that build, not break. It shapes how we collaborate, make decisions, and engage with each other, our stakeholders, and the participants we serve.'},
  {name:'Relational over Hierarchical', meaning:'We lead through trust, not titles. You can expect a flat structure where your insight and initiative matter as much as your job description. Everyone is seen as a leader in their own right.'},
  {name:'Open Communication and Transparency', meaning:'Communication is at the heart of our culture. We believe in transparency and open dialogue at all levels.'},
  {name:'Ownership & Autonomy', meaning:'We hire people for their potential, then give them space to lead. You\'ll be trusted with responsibility early, and supported to figure things out.'},
  {name:'Calm Hustle', meaning:'We move fast when needed, but never at the expense of our humanity. There\'s an intentional pace to our work that values clarity, wellbeing, and sustainable effort over constant urgency.'},
  {name:'Growth Through Feedback', meaning:'We believe feedback is fuel for growth. You\'ll be part of a culture where we openly reflect, iterate, and support one another to get better every day.'},
];

const HOW_WE_WORK = [
  {title:'Decision-making', body:`<div class="aw-block"><strong>Who decides:</strong> Department leads decide within their mandate; cross-functional decisions go to the relevant leadership forum.</div><div class="aw-block"><strong>Who contributes:</strong> Anyone directly affected by the decision should be consulted before it is finalised.</div><div class="aw-block"><strong>Documentation:</strong> Decisions are logged in the relevant meeting notes and shared with affected teams.</div>`},
  {title:'Communication norms', body:`<div class="aw-block"><strong>Channel selection:</strong> Email for async updates, calls for anything nuanced or sensitive.</div><div class="aw-block"><strong>Response expectations:</strong> Within one working day for non-urgent messages.</div><div class="aw-block"><strong>Meeting etiquette:</strong> Agenda shared in advance, notes shared after, cameras on where possible.</div>`},
  {title:'Accountability', body:`<div class="aw-block"><strong>Ownership:</strong> Every deliverable has one named owner, even when several people contribute.</div><div class="aw-block"><strong>Escalation:</strong> Raise risks to deadlines as soon as they're visible, not at the deadline.</div><div class="aw-block"><strong>Handling mistakes:</strong> Name it, fix what you can, share the lesson.</div>`},
  {title:'Feedback and conflict', body:`<div class="aw-block"><strong>Giving feedback:</strong> Timely, specific, and directed at the work rather than the person.</div><div class="aw-block"><strong>Raising concerns:</strong> Direct conversation first; your manager or People/HR if that isn't possible.</div>`},
  {title:'Safeguarding and ethical conduct', body:`<div class="aw-block"><strong>Core responsibilities:</strong> Every employee is responsible for the safety and dignity of participants, colleagues and communities.</div><div class="aw-block"><strong>Reporting routes:</strong> Safeguarding Lead, or the confidential reporting line, see Policies section.</div><div class="aw-block"><strong>Non-negotiables:</strong> Zero tolerance for abuse, exploitation or harassment.</div>`},
  {title:'Inclusion and disability accommodation', body:`<div class="aw-block"><strong>Commitment:</strong> Reasonable accommodations are available to any employee who requests them.</div><div class="aw-block"><strong>Process:</strong> Speak with People/HR, requests are handled confidentially.</div>`},
  {title:'Risk and escalation', body:`<div class="aw-block"><strong>What must be escalated:</strong> Safeguarding concerns, financial irregularities, reputational risks, safety incidents.</div><div class="aw-block"><strong>Timeframe:</strong> Immediately for safety/safeguarding; within 24 hours for other significant risks.</div>`},
  {title:'Wellbeing and sustainable performance', body:`<div class="aw-block"><strong>Calm hustle:</strong> Moving with urgency and care, without normalising burnout.</div><div class="aw-block"><strong>Leave & boundaries:</strong> Take your leave, protect focus time, raise workload concerns early with your manager.</div>`},
  {title:'Meetings and collaboration', body:`<div class="aw-block"><strong>1:1s:</strong> Weekly with your manager, prepared in advance by you.</div><div class="aw-block"><strong>Decision records:</strong> Action owners and deadlines captured in every meeting.</div>`},
];

function renderResourceList(items, showStatus=true){

/* =========================================================================
   STATE
   ========================================================================= */
const STORE_KEY = 'elHubProgressV3';
function loadState(){
  try{ return Object.assign({checklist:{}, modules:{}, roadmap:{}, visited:{}, systems:{}}, JSON.parse(localStorage.getItem(STORE_KEY))); }
  catch(e){ return {checklist:{}, modules:{}, roadmap:{}, visited:{}, systems:{}}; }
}
function saveState(){ localStorage.setItem(STORE_KEY, JSON.stringify(state)); }
let state = loadState();

function statusLabel(s){
  return {not_started:'Not started', in_progress:'In progress', complete:'Complete', action_required:'Action required'}[s] || 'Not started';
}
function badge(status){
  return `<span class="badge badge-${status}">${statusLabel(status)}</span>`;
}
/* shared photo-placeholder icon + avatar markup, used in hero, team grid, and modal */
function photoIcon(){
  return `<svg width="30" height="30" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M4 8a2 2 0 0 1 2-2h1.5l1-1.6A2 2 0 0 1 10.2 3.4h3.6a2 2 0 0 1 1.7 1L16.5 6H18a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V8Z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/><circle cx="12" cy="13" r="3.2" stroke="currentColor" stroke-width="1.6"/></svg>`;
}
function avatarPlaceholder(initials, photo){
  if(photo){
    return `<div class="avatar avatar-photo"><img src="${photo}" alt="${initials}"></div>`;
  }
  return `<div class="avatar">${photoIcon()}<span class="avatar-initials">${initials}</span></div>`;
}

/* compute overall progress: checklist items + module statuses + roadmap statuses */
function computeOverallProgress(){
  let total = 0, done = 0;
  CHECKLIST_DAY1.forEach(c=>{ total++; if(state.checklist[c.id]) done++; });
  Object.values(MODULES).flat().forEach(m=>{
    if(!m) return; total++;
    const st = state.modules[m.title] || m.status;
    if(st==='complete') done++;
  });
  ROADMAP.forEach(r=>{
    total++;
    const st = roadmapStatus(r);
    if(st==='complete') done++;
  });
  NAV.forEach(n=>{ total++; if(state.visited[n.id]) done++; });
  SYSTEMS.forEach(s=>{ total++; if(state.systems[s.name]) done++; });
  return total ? Math.round((done/total)*100) : 0;
}
function refreshOverallProgress(){
  const pct = computeOverallProgress();
  const heroFill = document.getElementById('hero-progress-fill');
  const heroLabel = document.getElementById('hero-progress-label');
  if(heroFill){ heroFill.style.width = pct+'%'; }
  if(heroLabel){ heroLabel.textContent = pct+'% complete'; }
  const roadmapTrack = document.getElementById('roadmap-track');
  if(roadmapTrack){ roadmapTrack.innerHTML = '<div class="roadmap-line"></div>' + renderRoadmapItems(); }
}

   ========================================================================= */
function renderNav(){
  const nav = document.getElementById('mainnav');
  nav.innerHTML = NAV.map(n=>`<button data-nav="${n.id}">${n.label}</button>`).join('');
  nav.querySelectorAll('button').forEach(b=>{
    b.addEventListener('click', ()=>{ goTo(b.dataset.nav); document.getElementById('mainnav').classList.remove('open'); });
  });
}
document.getElementById('mobilenav-toggle').addEventListener('click', function(){
  const nav = document.getElementById('mainnav');
  const open = nav.classList.toggle('open');
  this.setAttribute('aria-expanded', open);
});

let currentSection = 'start';
function goTo(id){
  document.querySelectorAll('.section-panel').forEach(p=>p.classList.remove('active'));
  document.getElementById('panel-'+id).classList.add('active');
  document.querySelectorAll('#mainnav button').forEach(b=>b.classList.toggle('active', b.dataset.nav===id));
  window.scrollTo({top:0, behavior:'smooth'});
  location.hash = id;
  currentSection = id;
  updateScrollProgress();
  refreshOverallProgress();
}

function renderModule(m){
  const st = state.modules[m.title] || m.status;
  return `

    <div class="module-head">
      <div>
        <h3>${m.title}</h3>
        <div class="module-meta">
          <span>⏱ ${m.time}</span>
          <span>${badge(st)}</span>
        </div>
      </div>
      <div class="action-row">
        <button class="btn btn-outline btn-sm" data-set-status="${m.title}" data-status="in_progress">Mark in progress</button>
        <button class="btn btn-primary btn-sm" data-set-status="${m.title}" data-status="complete">Mark complete</button>
      </div>
    </div>
    <div class="module-body">
      <div class="module-content">
        <h5>Learning outcomes, by the end, you should be able to…</h5>
        <ul class="outcomes">${m.outcomes.map(o=>`<li>${o}</li>`).join('')}</ul>
        <h5>Core content</h5>

      </div>
      <div class="module-side">

        <div class="field"><div class="field-label">Evidence of completion</div><div class="field-value">${m.evidence}</div></div>

        <div class="field"><div class="field-label">Support</div><div class="field-value">${m.support}</div></div>
        ${m.title.startsWith('Module 6') ? `<div class="field"><div class="field-label">30 / 60 / 90-day integration</div><div class="field-value">When your first 90 days are done, mark this stage complete to finish your onboarding.</div>${roadmapI90Action(roadmapStatus(ROADMAP.find(r=>r.id==='i-90')))}</div>` : ''}
      </div>
    </div>
  </div>`;
}

function bindModuleButtons(root){
  root.querySelectorAll('[data-set-status]').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      state.modules[btn.dataset.setStatus] = btn.dataset.status;
      saveState();
      renderAll();
      refreshOverallProgress();
    });
  });
}

function openTeamModal(i){
  const t = TEAM[i];
  document.getElementById('modal-content').innerHTML = `
    <button class="modal-close" id="modal-close-btn" aria-label="Close">&times;</button>
    ${avatarPlaceholder(t.initials, t.photo)}
    <h3>${t.name} ${t.pronouns ? `<span style="font-size:14px;color:var(--ink-500);font-weight:400;">(${t.pronouns})</span>`:''}</h3>
    <div style="color:var(--ink-500); font-weight:600; font-size:13.5px;">${t.role} · ${t.dept}</div>
    <dl>
      ${t.background ? `<dt>Background</dt><dd>${t.background}</dd>` : `<dt>Background</dt><dd class="tag-sample">To be added.</dd>`}
      ${t.personal ? `<dt>A little about them</dt><dd>${t.personal}</dd>` : ''}
      ${t.comeFor ? `<dt>Come to them for</dt><dd>${t.comeFor}</dd>` : ''}
      <dt>Preferred contact</dt><dd>${t.contact}</dd>
      ${t.style ? `<dt>Working style</dt><dd>${t.style}</dd>` : ''}
      <dt>Availability</dt><dd>${t.availability}</dd>
    </dl>
  `;
  document.getElementById('modal-overlay').classList.add('open');
  document.getElementById('modal-close-btn').addEventListener('click', closeModal);
}
function closeModal(){ document.getElementById('modal-overlay').classList.remove('open'); }
document.getElementById('modal-overlay').addEventListener('click', e=>{ if(e.target.id==='modal-overlay') closeModal(); });
document.addEventListener('keydown', e=>{ if(e.key==='Escape') closeModal(); });

   ========================================================================= */
function renderWork(){
  return `
  <div class="section-head">
    <span class="eyebrow">Module 4</span>
    <h2>How We Work</h2>
    <p>The culture that shapes how we work together, day to day.</p>
  </div>

  <div class="grid-3" style="margin-bottom:34px;">
    ${VALUES.map(v=>`
      <div class="value-card">
        <h4><span class="vtag"></span>${v.name}</h4>
        <dl>
          <dd>${v.meaning}</dd>
        </dl>
      </div>`).join('')}
  </div>

  <h3 style="font-size:20px; margin-bottom:10px;">Everyday practice</h3>
  <div id="accordion">
    ${HOW_WE_WORK.map((a,i)=>`
      <div class="accordion-item" data-idx="${i}">
        <button class="accordion-trigger" aria-expanded="false">
          <span>${a.title}</span>
          <svg class="chev" width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="M4 6l4 4 4-4" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
        <div class="accordion-panel"><div class="accordion-panel-inner">${a.body}</div></div>
      </div>`).join('')}
  </div>
  ${renderResourceList(RESOURCES.work, false)}
  `;
}

function bindAccordion(){
  document.querySelectorAll('.accordion-trigger').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const item = btn.closest('.accordion-item');
      const panel = item.querySelector('.accordion-panel');
      const isOpen = item.classList.contains('open');
      document.querySelectorAll('.accordion-item.open').forEach(o=>{
        o.classList.remove('open');
        o.querySelector('.accordion-panel').style.maxHeight = null;
        o.querySelector('.accordion-trigger').setAttribute('aria-expanded','false');
      });
      if(!isOpen){
        item.classList.add('open');
        panel.style.maxHeight = panel.scrollHeight + 'px';
        btn.setAttribute('aria-expanded','true');
      }
    });
  });
}

   RENDER, SYSTEMS
   ========================================================================= */
function renderSystems(){
  return `
  <div class="section-head">
    <span class="eyebrow">Module 5, part B</span>
    <h2>Systems & Ways of Working</h2>
    <p>What each tool is for, who owns it, and a quick task to confirm you can use it.</p>
  </div>
  <div class="grid-2">
    ${SYSTEMS.map(s=>{
      const val = state.systems[s.name];
      const confirmed = val === true;
      const notRelevant = val === 'na';
      return `
      <div class="pc">
        <h4>${s.name}</h4>
        <div class="pc-row"><b>What it is:</b> ${s.what}</div>
        <div class="pc-row"><b>Used for:</b> ${s.use}</div>
        <div class="pc-row"><b>Not used for:</b> ${s.notUse}</div>
        <div class="pc-row"><b>Who needs access:</b> ${s.access}</div>
        <div class="pc-row"><b>Access resets / support:</b> ${s.reset}</div>
        <div class="pc-row"><b>System owner:</b> ${s.owner}</div>
        <div class="pc-row"><b>Rules & data security:</b> ${s.rules}</div>
        <div class="pc-row"><b>Two-minute quick-start:</b> ${s.quickstart}</div>
        <div class="action-row">
          <button class="btn ${confirmed ? 'btn-outline' : 'btn-primary'} btn-sm" data-confirm-system="${s.name}">
            ${confirmed ? '✓ Confirmed, click to undo' : 'Confirm I can use this'}
          </button>
          ${s.optional ? `
          <button class="btn ${notRelevant ? 'btn-outline' : 'btn-primary'} btn-sm" data-na-system="${s.name}" style="margin-left:8px;">
            ${notRelevant ? '✓ Not relevant, click to undo' : 'Not relevant for my role'}
          </button>` : ''}
          ${confirmed || notRelevant ? `<span style="margin-left:8px;">${badge('complete')}</span>` : ''}
        </div>
      </div>`;
    }).join('')}
  </div>
  `;
}

   MASTER RENDER
   ========================================================================= */
function renderAll(){
  const main = document.getElementById('main');
  main.innerHTML = `
    <div class="section-panel" id="panel-start">${renderStart()}</div>
    <div class="section-panel" id="panel-story">${renderStory()}</div>
    <div class="section-panel" id="panel-people">${renderPeople()}</div>
    <div class="section-panel" id="panel-work">${renderWork()}</div>
    <div class="section-panel" id="panel-policies">${renderPolicies()}${renderSystems()}</div>
    <div class="section-panel" id="panel-role">${renderRole()}</div>
  `;

  // bind checklist
  CHECKLIST_DAY1.forEach(c=>{
    const el = document.getElementById(c.id);
    if(el){ el.addEventListener('change', ()=>{ state.checklist[c.id] = el.checked; saveState(); refreshOverallProgress(); }); }
  });

  // bind hero nav buttons
  main.querySelectorAll('[data-nav]').forEach(b=> b.addEventListener('click', ()=> goTo(b.dataset.nav)) );

  // bind module mark-complete buttons
  bindModuleButtons(main);

  // bind systems "Confirm I can use this" buttons
  main.querySelectorAll('[data-confirm-system]').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const name = btn.dataset.confirmSystem;
      state.systems[name] = state.systems[name] === true ? false : true;
      saveState();
      renderAll();
      refreshOverallProgress();
    });
  });

  // bind systems "Not relevant for my role" buttons
  main.querySelectorAll('[data-na-system]').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const name = btn.dataset.naSystem;
      state.systems[name] = state.systems[name] === 'na' ? false : 'na';
      saveState();
      renderAll();
      refreshOverallProgress();
    });
  });

  // bind team cards
  main.querySelectorAll('[data-team]').forEach(card=>{
    card.addEventListener('click', ()=> openTeamModal(card.dataset.team));
    card.addEventListener('keydown', e=>{ if(e.key==='Enter' || e.key===' '){ e.preventDefault(); openTeamModal(card.dataset.team); } });
  });

  bindAccordion();

  // restore active panel
  const activeId = (location.hash || '#start').replace('#','');
  const valid = NAV.some(n=>n.id===activeId) ? activeId : 'start';
  document.getElementById('panel-'+valid).classList.add('active');
  document.querySelectorAll('#mainnav button').forEach(b=>b.classList.toggle('active', b.dataset.nav===valid));
  currentSection = valid;
}

/* small helper style for inline SAMPLE tags injected via innerHTML */
const styleTag = document.createElement('style');
styleTag.textContent = `.tag-sample{background:var(--orange-100); color:#8A4B1F; font-size:11.5px; font-weight:700; padding:2px 7px; border-radius:6px; margin-left:2px;}`;
document.head.appendChild(styleTag);

renderNav();
renderAll();
refreshOverallProgress();
window.addEventListener('hashchange', ()=>{
  const id = location.hash.replace('#','');
  if(NAV.some(n=>n.id===id)) goTo(id);
});

/* ---------- Scroll-based reading progress ----------
   The top hairline bar reflects how far through the CURRENT section the
   person has scrolled. Once they pass ~85% of a section's content, that
   section is marked "visited" and starts counting toward the overall
   onboarding progress shown in the nav bar and hero, so progress moves
   as people actually read, not only when they tick boxes. */
let scrollTicking = false;
function updateScrollProgress(){
  const doc = document.documentElement;
  const scrollable = doc.scrollHeight - window.innerHeight;
  const fraction = scrollable > 0 ? Math.min(1, Math.max(0, window.scrollY / scrollable)) : 1;
  const bar = document.getElementById('scroll-progress');
  if(bar) bar.style.width = (fraction*100)+'%';

  if(fraction > 0.85 && !state.visited[currentSection]){
    state.visited[currentSection] = true;
    saveState();
    refreshOverallProgress();
  }
}
window.addEventListener('scroll', ()=>{
  if(scrollTicking) return;
  scrollTicking = true;
  requestAnimationFrame(()=>{ updateScrollProgress(); scrollTicking = false; });
}, {passive:true});
updateScrollProgress();

</script>
</body>
